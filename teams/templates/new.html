<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Team Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://kit.fontawesome.com/a2e0e6ea42.js" crossorigin="anonymous"></script>
</head>
<body>
  <main class="container mt-4">
    <div class="d-flex align-items-center gap-3 mb-4">
      <div class="bg-primary text-white rounded-circle d-flex justify-content-center align-items-center" style="width: 40px; height: 40px;">
        <i class="fas fa-home"></i>
      </div>
      <h1 class="h5 fw-semibold mb-0">Team</h1>
    </div>

    <div class="mb-4 d-flex gap-2">
      <input type="text" id="searchInput" class="form-control" placeholder="Search by name or position" />
      <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addModal">Add Team</button>
    </div>

    <div class="row" id="teamContainer">
      <!-- Team cards go here -->
    </div>
  </main>

  <!-- Add Modal -->
  <div class="modal fade" id="addModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form id="addForm" class="modal-content" enctype="multipart/form-data">
        <div class="modal-header">
          <h5 class="modal-title">Add Team Member</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="text" name="name" class="form-control mb-2" placeholder="Name" required>
          <input type="text" name="position" class="form-control mb-2" placeholder="Position" required>
          <input type="file" name="image" class="form-control mb-2">
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary" type="submit">Add</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Modal Template -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form id="editForm" class="modal-content" enctype="multipart/form-data">
        <div class="modal-header">
          <h5 class="modal-title">Edit Team Member</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="id">
          <input type="text" name="name" class="form-control mb-2" required>
          <input type="text" name="position" class="form-control mb-2" required>
          <input type="file" name="image" class="form-control mb-2">
          <img id="currentImage" src="" width="100" class="my-2 rounded-circle"/>
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary" type="submit">Save</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_URL = "http://localhost:8000/api/team/";
    const teamContainer = document.getElementById("teamContainer");

    async function fetchTeam() {
      const res = await fetch(API_URL);
      const data = await res.json();
      renderTeam(data);
    }

    function renderTeam(teamList) {
      teamContainer.innerHTML = "";
      teamList.forEach(member => {
        const card = document.createElement("div");
        card.className = "col-md-3 mb-4";
        card.innerHTML = `
          <div class="card h-100 text-center">
            <div class="card-body">
              <h5 class="card-title">${member.name}</h5>
              <p class="card-text">${member.position}</p>
              ${member.image ? `<img src="${member.image}" alt="${member.name}" width="100" height="100" class="rounded-circle mb-2" />` : ""}
              <div>
                <button class="btn btn-sm btn-primary me-2" onclick="openEdit(${member.id}, '${member.name}', '${member.position}', '${member.image || ''}')">Edit</button>
                <button class="btn btn-sm btn-danger" onclick="deleteMember(${member.id})">Delete</button>
              </div>
            </div>
          </div>
        `;
        teamContainer.appendChild(card);
      });
    }

    document.getElementById("searchInput").addEventListener("input", function () {
      const keyword = this.value.toLowerCase();
      document.querySelectorAll("#teamContainer .card").forEach(card => {
        card.parentElement.style.display = card.textContent.toLowerCase().includes(keyword) ? "" : "none";
      });
    });

    document.getElementById("addForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const formData = new FormData(this);
      const res = await fetch(API_URL, {
        method: "POST",
        body: formData,
      });
      if (res.ok) {
        bootstrap.Modal.getInstance(document.getElementById("addModal")).hide();
        this.reset();
        fetchTeam();
      }
    });

    function openEdit(id, name, position, image) {
      const modal = new bootstrap.Modal(document.getElementById("editModal"));
      const form = document.getElementById("editForm");

      form.id.value = id;
      form.name.value = name;
      form.position.value = position;
      document.getElementById("currentImage").src = image;

      modal.show();
    }

    document.getElementById("editForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const formData = new FormData(this);
      const id = formData.get("id");
      formData.delete("id");

      const res = await fetch(`${API_URL}${id}/`, {
        method: "PUT",
        body: formData,
      });

      if (res.ok) {
        bootstrap.Modal.getInstance(document.getElementById("editModal")).hide();
        fetchTeam();
      }
    });

    async function deleteMember(id) {
      if (!confirm("Are you sure you want to delete this member?")) return;
      const res = await fetch(`${API_URL}${id}/`, { method: "DELETE" });
      if (res.ok) fetchTeam();
    }

    fetchTeam();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
